services:
  - type: web
    name: novel-platform-api
    runtime: node
    plan: free
    rootDir: services/api
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        description: "Đường dẫn kết nối PostgreSQL của Neon (ví dụ: postgresql://...)"
      - key: R2_ACCOUNT_ID
        sync: false
        description: "Cloudflare R2 Account ID"
      - key: R2_ACCESS_KEY_ID
        sync: false
        description: "Cloudflare R2 Access Key ID"
      - key: R2_SECRET_ACCESS_KEY
        sync: false
        description: "Cloudflare R2 Secret Access Key"
      - key: R2_BUCKET_NAME
        sync: false
        description: "Tên bucket lưu trữ trên Cloudflare R2"
      - key: R2_PUBLIC_DOMAIN
        sync: false
        description: "Domain công khai để truy cập file trên Cloudflare R2 (ví dụ: https://data.novel.id.vn)"
      - key: FRONTEND_URL
        sync: false
        description: "URL trang Frontend trên Vercel để cấu hình CORS (ví dụ: https://novel-platform.vercel.app)"
